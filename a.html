<body>
  <div class="form-container">
    <div class="logo-bar">
      <div class="logo-left">
        <img
          src="AstraZeneca-logo.png"
          alt="AstraZeneca logo"
        >
      </div>

    </div>
    <form id="registration-form">
      <img
        class="title-emblem"
        src="Lung-Health-emblem.png"
        alt="Lung Health emblem"
      >
      <h1 class="form-title">Lung Health</h1>
      <h2 class="disease-title">District</h2>
      <p class="form-subtitle">Please fill in all the required information</p>
      
      <input type="text" name="FirstName" placeholder="First Name" required>
      <input type="text" name="LastName" placeholder="Last Name" required>
      <input type="text" name="Speciality" placeholder="Speciality" required>
      <input type="text" name="Hospital" placeholder="Hospital" required>
      <input type="tel" name="MobileNumber" placeholder="Mobile Number" required>
      <input type="email" name="Email" placeholder="Email Address" required>
      <input type="text" name="SCFHS" placeholder="SCFHS" required>
      <button type="submit" id="submit">Register Now</button>
    </form>
    <footer class="page-footer">
      Powered by <strong>AstraZeneca Saudi Arabia</strong> | Lung Health Clinic
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // Toast Notification Function
    function showToast(message, type = 'success') {
      const toastContainer = document.getElementById('toast-container')
      const toast = document.createElement('div')
      toast.className = `toast ${type}`
      
      const icon = type === 'success' ? '✓' : '✕'
      toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span class="toast-message">${message}</span>
      `
      
      toastContainer.appendChild(toast)
      
      // Remove toast after animation completes
      setTimeout(() => {
        toast.remove()
      }, 3000)
    }

    const scriptURL = 'https://script.google.com/macros/s/AKfycbxIdQJCC-IGvRouuguqzaTjEtKNyv9syoiS6kUTj7dagSzeIHltWN86tzGqopJ-B3bH/exec'
    const form = document.getElementById('registration-form')

    form.addEventListener('submit', e => {
      e.preventDefault()
      
      // Disable submit button to prevent double submission
      const submitButton = document.getElementById('submit')
      const originalText = submitButton.textContent
      submitButton.disabled = true
      submitButton.textContent = 'Submitting...'
      
      // Convert FormData to URL-encoded format for better compatibility
      const formData = new FormData(form)
      const data = new URLSearchParams()
      for (const pair of formData) {
        data.append(pair[0], pair[1])
      }
      
      fetch(scriptURL, { 
        method: 'POST', 
        mode: 'no-cors', // Required for Google Apps Script
        redirect: 'follow',
        body: data
      })
        .then(() => {
          // With no-cors mode, we can't read response, but if fetch succeeds, assume it worked
          // Small delay to ensure data is saved
          setTimeout(() => {
            showToast("Registered successfully!", "success")
            form.reset()
            submitButton.disabled = false
            submitButton.textContent = originalText
          }, 500)
        })
        .catch(error => {
          console.error('=== ERROR DETAILS ===')
          console.error('Error type:', error.name)
          console.error('Error message:', error.message)
          console.error('Full error:', error)
          console.error('Script URL:', scriptURL)
          console.error('========================')
          
          let errorMsg = "An error occurred while submitting the form. "
          errorMsg += "Please check: Google Apps Script access, sheet headers, or network connection."
          
          showToast(errorMsg, "error")
          submitButton.disabled = false
          submitButton.textContent = originalText
        })
    })
  </script>
